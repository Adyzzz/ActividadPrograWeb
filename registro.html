<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro de Talleres</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="header-principal">
        <h1 class="titulo-sitio">Registro de Asistencia a Talleres</h1>
        <p class="subtitulo-sitio">Centro de Estudios Científicos y Tecnológicos "Juan de Dios Bátiz"</p>
        <nav class="navegacion">
            <a href="index.html" class="btn-volver">Volver al Catálogo</a>
        </nav>
    </header>

    <main class="contenedor-principal">
        <section class="seccion-registro">
            <h2 class="titulo-seccion">Completa tus datos</h2>
            
            <form action="#" method="post" id="form-registro" class="formulario">
                
                <div class="grupo-formulario">
                    <label for="nombre" class="etiqueta">NOMBRE COMPLETO:</label>
                    <input type="text" id="nombre" name="nombre" class="entrada" placeholder="ej. Ady Esly León Gómez" required>
                </div>

                <div class="grupo-formulario">
                    <label for="boleta" class="etiqueta">NUMERO DE BOLETA:</label>
                    <input type="text" id="boleta" name="boleta" class="entrada" pattern="[0-9]{10}" placeholder="10 digitos" required>
                </div>

                <div class="grupo-formulario">
                    <label for="taller" class="etiqueta">SELECCIONA EL TALLER:</label>
                    <select name="taller" id="taller" class="entrada" required>
                        <option value="" disabled selected>Elije una opción...</option>
                        <option value="IntroduccionPython">Introducción a Python</option>
                        <option value="FundamentosRedes">Fundamentos de Redes</option>
                        <option value="DiseñoBd">Diseño de Base de Datos</option>
                    </select>
                </div>

                <button type="submit" class="btn-enviar">Registrar asistencia</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy;2026 CECyT 9, PROYECTO INTEGRADOR GIT.</p>
    </footer>

</body>
</html>
